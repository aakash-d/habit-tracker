spring.config.import=optional:file:.env[.properties]

spring.application.name=habit-tracker-api

# MySQL connection
spring.datasource.url=jdbc:h2:file:${user.home}/.habit-tracker/habit_tracker
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=${PORT:8080}

# Auth
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars-long}
app.jwt.expiration-days=30
app.registration-code=${REGISTRATION_CODE:dev-invite}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}